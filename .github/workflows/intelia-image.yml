# Intelia fork: tests the table converter and publishes the bridge image to GHCR.
# The compose of the software factory pins the image by digest (see the job summary).
name: Intelia image

on:
  push:
    branches: ["intelia/**"]
    tags: ["v*-intelia.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GOTOOLCHAIN: local
  IMAGE: ghcr.io/intelia-technologies/mautrix-slack

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Install libolm
        run: sudo apt-get update && sudo apt-get install -y libolm-dev

      # The two message mention tests already fail upstream at v0.2610.0 (they need a logged-in
      # user in the context); they are skipped until upstream fixes them.
      - name: Test
        run: |
          go vet ./...
          go test -skip '^TestSlackBlocksToMatrixMessageMention(Permalink)?$' ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        run: |
          tags="${IMAGE}:sha-${GITHUB_SHA::12}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags="${tags},${IMAGE}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      # provenance: false leaves a single manifest, as the software factory images do.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          echo "Image: \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Tags: ${TAGS}" >> "$GITHUB_STEP_SUMMARY"
